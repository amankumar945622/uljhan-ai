<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULJHAN AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <header class="header-container">
            <button class="menu-button" id="menu-toggle-btn">☰</button>
            <div class="model-selector">
                <span>ULJHAN AI</span>
                <span class="dropdown-icon">▼</span>
            </div>
            <button class="new-chat-button" id="new-chat-btn">✏️</button>
        </header>

        <!-- Sidebar / Menu Drawer for History Option -->
        <div class="sidebar-menu" id="sidebar-menu" style="display: none; position: absolute; top: 60px; left: 10px; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 10px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <button id="clear-history-option" style="background: none; border: none; font-size: 15px; cursor: pointer; color: #d9534f; display: flex; align-items: center; gap: 6px;">🗑️ Clear History</button>
        </div>

        <!-- Main Chat Area -->
        <main class="home-container" id="chat-container">
            <div class="welcome-container" id="welcome-screen">
                <div class="ai-star-logo">✦</div>
                <h1 class="welcome-title">Welcome</h1>
                <p class="welcome-text">Your Personal AI Assistant</p>
            </div>
            <div class="content-container" id="messages-list"></div>
        </main>

        <!-- Bottom Input Wrapper -->
        <footer class="input-wrapper">
            <div class="attachment-popup" id="attachment-popup" style="display: none;">
                <button class="popup-option" id="btn-photo"><span>📷</span> Photo</button>
            </div>

            <div class="media-preview-container" id="media-preview" style="display: none;">
                <span id="preview-text">File attached</span>
                <button id="remove-media">✕</button>
            </div>

            <div class="input-container">
                <button class="attach-btn" id="attach-toggle-btn">+</button>
                <textarea id="user-input" class="chat-input" placeholder="Ask ULJHAN AI..." rows="1"></textarea>
                <button class="action-btn" id="mic-btn" title="Voice Input">🎙️</button>
                <button class="action-btn send-btn" id="send-btn" title="Send">⚡</button>
            </div>
            <div class="safe-area-container"></div>
        </footer>
    </div>

    <input type="file" id="hidden-file-input" accept="image/*" style="display: none;">

    <script src="app.js"></script>
</body>
</html>
