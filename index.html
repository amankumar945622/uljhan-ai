<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULJHAN AI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; display: flex; flex-direction: column; height: 100vh; }
        header { background: #ffffff; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 75%; word-wrap: break-word; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .bot { background: #e4e6eb; color: black; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ddd; align-items: center; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #saveModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 300px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <button onclick="toggleSidebar()">☰</button>
        <h2>ULJHAN AI</h2>
        <button onclick="promptClearOrSave()">✏️</button>
    </header>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask ULJHAN AI..." onkeypress="handleKeyPress(event)">
        <button onclick="startVoiceInput()">🎤</button>
        <button onclick="sendMessage()">➤</button>
    </div>

    <!-- Save / Clear Notification Modal -->
    <div id="saveModal">
        <div class="modal-content">
            <h3>Page Clear Hone Wala Hai!</h3>
            <p>Kya aap is conversation ko apni permanent history mein save karna chahte hain?</p>
            <button onclick="saveCurrentSession()" style="background:green;">Save karo</button>
            <button onclick="discardSession()" style="background:red;">Clear/Cancel</button>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const res = await fetch('/api/history');
            const data = await res.json();
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            data.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
                div.innerText = msg.text;
                container.appendChild(div);
            });
            scrollToBottom();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const container = document.getElementById('chat-container');
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = message;
            container.appendChild(userDiv);
            input.value = '';
            scrollToBottom();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();

                const botDiv = document.createElement('div');
                botDiv.className = 'message bot';
                botDiv.innerText = data.reply;
                container.appendChild(botDiv);
                scrollToBottom();
            } catch (e) {
                console.error("Error:", e);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka browser voice input support nahi karta.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.onresult = function(event) {
                document.getElementById('userInput').value = event.results[0][0].transcript;
            };
            recognition.start();
        }

        function promptClearOrSave() {
            document.getElementById('saveModal').style.display = 'flex';
        }

        async function saveCurrentSession() {
            await fetch('/api/save-session', { method: 'POST' });
            document.getElementById('saveModal').style.display = 'none';
            location.reload();
        }

        async function discardSession() {
            await fetch('/api/clear', { method: 'POST' });
            document.getElementById('saveModal').style.display = 'none';
            location.reload();
        }

        function toggleSidebar() {
            alert("Sidebar history feature active hai. Purani chats server par safe hain!");
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
