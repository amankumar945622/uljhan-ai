<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULJHAN AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            color: #1f1f1f;
        }

        /* 1. होम कंटेनर (Home Container) - Poore page ka main wrapper */
        .home-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            background-color: #ffffff;
        }

        /* Top Header Area */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            background-color: #ffffff;
            flex-shrink: 0;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #5f6368;
            padding: 4px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 18px;
            color: #202124;
        }

        /* Scrollable Area for Welcome & Content Containers */
        .scroll-content-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 2. स्वागत कंटेनर (Welcome Container) */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            text-align: center;
        }

        .sparkle-icon {
            font-size: 48px;
            color: #db4437;
            margin-bottom: 12px;
        }

        .welcome-container h1 {
            font-size: 28px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 6px;
        }

        .welcome-container p {
            font-size: 15px;
            color: #5f6368;
        }

        /* 3. सामग्री कंटेनर (Content / Chat Stream Container) */
        .content-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .message-row.user {
            align-items: flex-end;
        }

        .message-row.model {
            align-items: flex-start;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message-row.user .bubble {
            background-color: #1a73e8;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message-row.model .bubble {
            background-color: #f1f3f4;
            color: #202124;
            border-bottom-left-radius: 4px;
        }

        .model-actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            margin-left: 4px;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 14px;
            color: #5f6368;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 4. इनपुट कंटेनर (Input Container) */
        .input-container-wrapper {
            padding: 12px 16px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .input-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 700px;
            background-color: #f1f3f4;
            border-radius: 28px;
            padding: 6px 12px;
            gap: 8px;
        }

        .input-container input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-size: 15px;
            color: #202124;
            padding: 8px 4px;
        }

        .input-container input::placeholder {
            color: #70757a;
        }

        .circle-btn {
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #5f6368;
            font-size: 18px;
        }

        .circle-btn.send {
            color: #1a73e8;
        }

        /* 5. सुरक्षित क्षेत्र कंटेनर (Safe Area Container) */
        .safe-area-container {
            background-color: #ffffff;
            width: 100%;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- 1. होम कंटेनर -->
    <div class="home-container">

        <!-- Header Section -->
        <header>
            <div class="header-left">
                <button class="icon-btn" id="menuBtn">☰</button>
                <div class="logo-area">
                    <span>ULJHAN AI</span>
                    <span style="font-size: 12px;">▼</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="newChatBtn">✏️</button>
            </div>
        </header>

        <!-- Scrollable Area -->
        <div class="scroll-content-area" id="scrollContentArea">
            
            <!-- 2. स्वागत कंटेनर -->
            <div class="welcome-container" id="welcomeContainer">
                <div class="sparkle-icon">✨</div>
                <h1>Welcome</h1>
                <p>Your Personal AI Assistant</p>
            </div>

            <!-- 3. सामग्री कंटेनर -->
            <div class="content-container" id="contentContainer"></div>

        </div>

        <!-- 4. इनपुट कंटेनर -->
        <div class="input-container-wrapper">
            <div class="input-container">
                <button class="circle-btn" id="uploadBtn">+</button>
                <input type="text" id="userInput" placeholder="Ask anything...">
                <button class="circle-btn" id="micBtn">🎤</button>
                <button class="circle-btn send" id="sendBtn">➤</button>
            </div>
        </div>

        <!-- 5. सुरक्षित क्षेत्र कंटेनर -->
        <div class="safe-area-container"></div>

    </div>

    <script>
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const contentContainer = document.getElementById('contentContainer');
        const welcomeContainer = document.getElementById('welcomeContainer');
        const scrollContentArea = document.getElementById('scrollContentArea');

        function appendMessage(sender, text) {
            if (welcomeContainer.style.display !== 'none') {
                welcomeContainer.style.display = 'none';
            }

            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            row.appendChild(bubble);

            if (sender === 'model') {
                const actions = document.createElement('div');
                actions.className = 'model-actions';
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.innerHTML = '📋 Copy';
                copyBtn.onclick = () => navigator.clipboard.writeText(text);

                actions.appendChild(copyBtn);
                row.appendChild(actions);
            }

            contentContainer.appendChild(row);
            scrollContentArea.scrollTop = scrollContentArea.scrollHeight;
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage('user', text);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                appendMessage('model', data.reply || "Server error.");
            } catch (err) {
                appendMessage('model', "Server error, kripya thodi der baad koshish karein.");
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
