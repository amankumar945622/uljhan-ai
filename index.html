<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULJHAN AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
        }
        .menu-btn, .clear-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Exact Original Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 8px;
        }
        .welcome-icon {
            font-size: 48px;
            color: #ff3366; /* Pink Spark Icon */
            margin-bottom: 4px;
        }
        .welcome-screen h1 {
            font-size: 32px;
            font-weight: 700;
            color: #111;
        }
        .welcome-screen p {
            font-size: 16px;
            color: #666;
        }
        /* Chat Bubbles */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #007bff;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        /* Input Area */
        .input-container {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #fff;
            border-top: 1px solid #e0e0e0;
            gap: 8px;
        }
        .input-container input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 24px;
            outline: none;
            font-size: 15px;
        }
        .action-btn {
            background: #007bff;
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }
        .mic-btn {
            background: #f1f3f5;
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn">☰</button>
        <div class="logo-area">
            <span>ULJHAN AI</span>
            <span>▼</span>
        </div>
        <button class="clear-btn" onclick="clearHistory()" title="New Chat">✏️</button>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">✨</div>
            <h1>Welcome</h1>
            <p>Your Personal AI Assistant</p>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Ask ULJHAN AI..." onkeypress="handleKeyPress(event)">
        <button class="action-btn mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
        <button class="action-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const userInput = document.getElementById('userInput');

        // Load existing history on start
        window.onload = async () => {
            try {
                const res = await fetch('/api/history');
                const history = await res.json();
                if (history && history.length > 0) {
                    if (welcomeScreen) welcomeScreen.remove();
                    history.forEach(msg => {
                        appendMessage(msg.text, msg.role === 'user' ? 'user-message' : 'bot-message');
                    });
                }
            } catch (e) {
                console.error("Could not load history", e);
            }
        };

        function appendMessage(text, className) {
            if (welcomeScreen && welcomeScreen.parentNode) {
                welcomeScreen.remove();
            }
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Auto Scroll
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage(text, 'user-message');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                appendMessage(data.reply || "Kripya dobara koshish karein.", 'bot-message');
            } catch (e) {
                appendMessage("Server error, kripya thodi der baad koshish karein.", 'bot-message');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function clearHistory() {
            await fetch('/api/clear', { method: 'POST' });
            location.reload();
        }

        // Voice Recognition (Mic Support)
        function toggleMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka browser Voice Recognition support nahi karta.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.onstart = () => { userInput.placeholder = "Sun rahe hain..."; };
            recognition.onresult = (event) => {
                userInput.value = event.results[0][0].transcript;
            };
            recognition.onerror = () => { userInput.placeholder = "Ask ULJHAN AI..."; };
            recognition.onend = () => { userInput.placeholder = "Ask ULJHAN AI..."; };
            recognition.start();
        }
    </script>
</body>
</html>
